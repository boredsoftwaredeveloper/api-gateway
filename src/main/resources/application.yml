server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ── Database (used by Flyway only — gateway has no JPA) ──────────
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST:db.zasidonntwaimayumbks.supabase.co}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    gateway:
      server:
        webflux:
          # ── Global defaults ──────────────────────────────────────────
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          # CORS is configured once in Java (SecurityConfig#corsConfigurationSource)
          # so local controllers (/auth/**) and proxied routes share the same policy.

          # ── Route definitions (static — no Eureka needed) ───────────
          routes:
            # Profile Service routes
            - id: profile-service
              uri: ${PROFILE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/profiles/**,/api/v1/experiences/**,/api/v1/achievements/**,/api/v1/aspirations/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: profileCircuitBreaker
                    fallbackUri: forward:/fallback/profile

            # Regret Stream Service routes
            - id: regret-stream-service
              uri: ${REGRET_STREAM_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/feed/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: regretCircuitBreaker
                    fallbackUri: forward:/fallback/regret

            # ── OpenAPI doc routes (for Swagger UI aggregation) ──────
            - id: profile-service-api-docs
              uri: ${PROFILE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/services/profile/api-docs/**
              filters:
                - RewritePath=/services/profile/api-docs(?<segment>/?.*), /api-docs${segment}

            - id: stream-service-api-docs
              uri: ${REGRET_STREAM_URL:http://localhost:8082}
              predicates:
                - Path=/services/stream/api-docs/**
              filters:
                - RewritePath=/services/stream/api-docs(?<segment>/?.*), /api-docs${segment}

# ── Springdoc (aggregated Swagger UI) ──────────────────────────────
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: Profile Service
        url: /services/profile/api-docs
      - name: Stream Service
        url: /services/stream/api-docs

# ── Supabase Auth ──────────────────────────────────────────────────
# Supabase signs JWTs with asymmetric ES256 keys; the gateway fetches the
# public set from the project's JWKS endpoint and validates tokens against
# it. Override SUPABASE_JWKS_URI directly if you need a non-standard path.
supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  jwks-uri: ${SUPABASE_JWKS_URI:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}

# ── Actuator ───────────────────────────────────────────────────────
# Only expose health + info publicly. The `gateway` endpoint leaks the
# entire route table and is kept disabled in prod; flip `include` to add
# it back for local debugging if needed.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ── Resilience4j Circuit Breaker ───────────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
    instances:
      profileCircuitBreaker:
        base-config: default
      regretCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

# ── Logging ────────────────────────────────────────────────────────
# LOG_FORMAT env var flips structured JSON on in Cloud Run (set LOG_FORMAT=ecs).
# Left empty locally so dev logs stay human-readable.
logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    org.springframework.cloud.gateway: INFO
    io.github.resilience4j: INFO
