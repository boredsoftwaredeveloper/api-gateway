name: API Gateway CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  id-token: write
  contents: read
  packages: read

env:
  GCP_PROJECT: boredsoftwaredev
  GCP_PROJECT_NUMBER: "849094850972"
  GCP_REGION: us-central1
  AR_REPO: backend
  SERVICE_NAME: api-gateway
  RUNTIME_SA: cloud-run-runtime@boredsoftwaredev.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - run: chmod +x gradlew
      - run: ./gradlew clean check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/849094850972/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@boredsoftwaredev.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build Docker image
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=gh_actor,env=GITHUB_ACTOR \
            --secret id=gh_token,env=GITHUB_TOKEN \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Resolve downstream service URLs
        id: urls
        run: |
          PROFILE_URL=$(gcloud run services describe profile-service --region=${{ env.GCP_REGION }} --format='value(status.url)')
          REGRET_URL=$(gcloud run services describe stream-service --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "PROFILE_URL=$PROFILE_URL" >> $GITHUB_OUTPUT
          echo "REGRET_URL=$REGRET_URL" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account=${{ env.RUNTIME_SA }} \
            --min-instances=0 \
            --max-instances=2 \
            --memory=1Gi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=60 \
            --set-secrets=DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,REDIS_HOST=REDIS_HOST:latest,REDIS_PORT=REDIS_PORT:latest,REDIS_PASSWORD=REDIS_PASSWORD:latest \
            --set-env-vars=LOG_FORMAT=ecs,SUPABASE_DB_HOST=aws-1-ap-southeast-2.pooler.supabase.com,SPRING_AUTOCONFIGURE_EXCLUDE=,REDIS_SSL_ENABLED=true,PROFILE_SERVICE_URL=${{ steps.urls.outputs.PROFILE_URL }},REGRET_STREAM_URL=${{ steps.urls.outputs.REGRET_URL }}
